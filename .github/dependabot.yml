# Dependabot
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/about-dependabot-version-updates

version: 2
updates:
  - package-ecosystem: github-actions

    # NOTE: The "/" here is for checking for workflow files in .github/workflows

    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: opentofu
    directories:
      - "**/*"
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    groups:
      opentofu:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
    groups:
      pre-commit:
        patterns:
          - "*"
