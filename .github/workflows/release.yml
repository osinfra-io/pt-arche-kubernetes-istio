name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/release.yml@873e5eb069348e446ddc20c9c96661073d4bec42  # v0.3.5
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
