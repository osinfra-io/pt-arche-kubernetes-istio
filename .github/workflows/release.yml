name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    uses: osinfra-io/pt-techne-misc-workflows/.github/workflows/release.yml@08a1f8d55cb21e733dc36c5abe3cb0b277114697  # v0.2.9
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
