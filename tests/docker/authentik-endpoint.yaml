apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: authentik
  - apiVersion: v1
    kind: Service
    metadata:
      name: authentik-server
      namespace: authentik
    spec:
      ports:
        - name: http
          port: 9000
          protocol: TCP
  - apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      labels:
        kubernetes.io/service-name: authentik-server
      name: authentik-server
      namespace: authentik
    addressType: IPv4
    endpoints:
      - addresses:
          - AUTHENTIK_HOST_IP
    ports:
      - name: http
        port: 9000
        protocol: TCP
