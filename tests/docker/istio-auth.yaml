apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: istio-ingress
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: gateway
      namespace: istio-ingress
    spec:
      gatewayClassName: istio
      listeners:
        - allowedRoutes:
            namespaces:
              from: All
          hostname: dev.localhost
          name: https
          port: 443
          protocol: HTTPS
          tls:
            certificateRefs:
              - name: gateway-localhost-tls
            mode: Terminate
  - apiVersion: v1
    kind: Namespace
    metadata:
      labels:
        istio-injection: enabled
      name: istio-test
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: metadata-mock-content
      namespace: istio-test
    data:
      cluster-name: docker-desktop
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: metadata-mock
      namespace: istio-test
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: metadata-mock
      template:
        metadata:
          labels:
            app: metadata-mock
        spec:
          containers:
            - command:
                - sh
                - -c
                - >-
                  mkdir -p /www/computeMetadata/v1/instance/attributes &&
                  cp /config/cluster-name /www/computeMetadata/v1/instance/attributes/cluster-name &&
                  httpd -f -p 8080 -h /www
              image: busybox:1.37
              name: metadata-mock
              volumeMounts:
                - mountPath: /config
                  name: content
          volumes:
            - configMap:
                name: metadata-mock-content
              name: content
  - apiVersion: v1
    kind: Service
    metadata:
      name: metadata-mock
      namespace: istio-test
    spec:
      ports:
        - port: 80
          targetPort: 8080
      selector:
        app: metadata-mock
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: istio-test
      namespace: istio-test
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: istio-test
      template:
        metadata:
          labels:
            app: istio-test
        spec:
          containers:
            - env:
                - name: ENABLE_PROFILER
                  value: "false"
                - name: ENABLE_TRACING
                  value: "false"
              image: istio-test:local
              imagePullPolicy: Never
              name: istio-test
              ports:
                - containerPort: 8080
                  name: http
              readinessProbe:
                httpGet:
                  path: /istio-test/health
                  port: http
  - apiVersion: v1
    kind: Service
    metadata:
      name: istio-test
      namespace: istio-test
    spec:
      ports:
        - name: http
          port: 8080
          targetPort: http
      selector:
        app: istio-test
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: authentik-outpost
      namespace: authentik
    spec:
      hostnames:
        - dev.localhost
      parentRefs:
        - name: gateway
          namespace: istio-ingress
      rules:
        - backendRefs:
            - name: authentik-server
              port: 9000
          matches:
            - path:
                type: PathPrefix
                value: /outpost.goauthentik.io
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: istio-test
      namespace: istio-test
    spec:
      hostnames:
        - dev.localhost
      parentRefs:
        - name: gateway
          namespace: istio-ingress
      rules:
        - backendRefs:
            - name: istio-test
              port: 8080
          matches:
            - path:
                type: PathPrefix
                value: /istio-test
  - apiVersion: security.istio.io/v1
    kind: AuthorizationPolicy
    metadata:
      name: authentik
      namespace: istio-ingress
    spec:
      action: CUSTOM
      provider:
        name: authentik
      rules:
        - to:
            - operation:
                hosts:
                  - dev.localhost
                paths:
                  - /istio-test
                  - /istio-test/*
                notPaths:
                  - /istio-test/health
                  - /istio-test/metadata/*
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway
