apiVersion: v1
kind: List
items:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: authentik
      namespace: authentik
    spec:
      hostnames:
        - authentik.localhost
      parentRefs:
        - name: gateway
          namespace: istio-ingress
      rules:
        - backendRefs:
            - name: authentik-server
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /source/oauth/
          filters:
            - type: URLRewrite
              urlRewrite:
                hostname: localhost
        - backendRefs:
            - name: authentik-server
              port: 80
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: authentik-google-callback
      namespace: authentik
    spec:
      hostnames:
        - localhost
      parentRefs:
        - name: gateway
          namespace: istio-ingress
          sectionName: https-localhost
      rules:
        - filters:
            - requestRedirect:
                hostname: authentik.localhost
                statusCode: 302
              type: RequestRedirect
          matches:
            - path:
                type: PathPrefix
                value: /source/oauth/callback/
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: authentik-outpost
      namespace: authentik
    spec:
      hostnames:
        - dev.localhost
      parentRefs:
        - name: gateway
          namespace: istio-ingress
      rules:
        - backendRefs:
            - name: authentik-server
              port: 80
          matches:
            - path:
                type: PathPrefix
                value: /outpost.goauthentik.io
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: istio-test
      namespace: istio-test
    spec:
      hostnames:
        - dev.localhost
      parentRefs:
        - name: gateway
          namespace: istio-ingress
      rules:
        - backendRefs:
            - name: istio-test
              port: 8080
          matches:
            - path:
                type: PathPrefix
                value: /istio-test
