apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      labels:
        istio.io/dataplane-mode: ambient
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: istio-test
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: metadata-mock-content
      namespace: istio-test
    data:
      cluster-name: docker-desktop
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: metadata-mock
      namespace: istio-test
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: metadata-mock
      template:
        metadata:
          labels:
            app: metadata-mock
        spec:
          containers:
            - command:
                - sh
                - -c
                - >-
                  mkdir -p /www/computeMetadata/v1/instance/attributes &&
                  cp /config/cluster-name /www/computeMetadata/v1/instance/attributes/cluster-name &&
                  httpd -f -p 8080 -h /www
              image: busybox:1.37
              name: metadata-mock
              volumeMounts:
                - mountPath: /config
                  name: content
          volumes:
            - configMap:
                name: metadata-mock-content
              name: content
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: metadata-mock
      namespace: istio-test
    spec:
      ports:
        - port: 80
          targetPort: 8080
      selector:
        app: metadata-mock
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: istio-test
      namespace: istio-test
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: istio-test
      template:
        metadata:
          labels:
            app: istio-test
        spec:
          containers:
            - env:
                - name: ENABLE_PROFILER
                  value: "false"
                - name: ENABLE_TRACING
                  value: "false"
              image: istio-test:local
              imagePullPolicy: Never
              name: istio-test
              ports:
                - containerPort: 8080
                  name: http
              readinessProbe:
                httpGet:
                  path: /istio-test/health
                  port: http
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        local-gateway-stack-owner: osinfra-local-gateway-stack
      name: istio-test
      namespace: istio-test
    spec:
      ports:
        - name: http
          port: 8080
          targetPort: http
      selector:
        app: istio-test
